<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Valentine 💘</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💌</text></svg>">
</head>

<body>

    <!-- Floating Background Elements -->
    <div class="bg-particles" id="bg-particles"></div>

    <div class="container">
        <!-- Cute Decor -->
        <div class="cupid-container">
            💘
        </div>

        <!-- The 3D Envelope -->
        <div class="envelope-wrapper" id="envelope">

            <div class="envelope-flap"></div>
            <div class="envelope-pocket"></div>

            <div class="letter">
                <div class="letter-content">
                    <h1>My Dearest,</h1>
                    <p>
                        "Every moment with you is like a sweet dream I never want to wake up from.<br><br>
                        You bring so much color and joy into my world."
                    </p>
                    <button class="btn-primary" id="reveal-btn">I have a question...</button>
                </div>
            </div>

            <!-- Interactive Wax Seal -->
            <div class="wax-seal" id="wax-seal">
                ❤️
            </div>
        </div>
    </div>

    <!-- The Big Question Overlay -->
    <div class="final-overlay" id="final-overlay">
        <h1 class="big-question">Will you be my<br>Valentine? 🌹</h1>
        <div class="buttons-group">
            <button class="yes-btn" id="yes-btn">YES! ❤️</button>
            <button class="no-btn" id="no-btn">No 😢</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
